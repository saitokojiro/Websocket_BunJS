  #   networks:
  #     - proxy-network
  #   # environment:
  #   #   - NGINX_HOST=saitokojiro.local
  #   #   - NGINX_PORT=80 
  proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
##docker-compose down -v
networks:
  proxy-network:
    driver: bridge