http {
    upstream backend {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name saitokojiro.local; # Accepte toutes les requêtes quel que soit le nom d'hôte

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 80 default_server;
        server_name _;
        return 404; # Ou une autre réponse par défaut
    }

    # Configuration pour HTTPS (si vous avez des certificats dans ./certs)
